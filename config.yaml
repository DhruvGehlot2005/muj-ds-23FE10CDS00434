# ==============================================================================
# AI Resume Analyzer & Job Compatibility Assessment Configuration
# ==============================================================================

# Server Network & Host Settings
server:
  host: "127.0.0.1"
  port: 8000
  frontend_url: "http://localhost:3000"

# LLM Reasoning Settings
llm:
  provider: "gemini"
  model: "gemini-3.5-flash-lite"
  api_key: ""  # Leave empty to load from LLM_API_KEY environment variable or .env file

# Security, Rate Limiting, and Classifier Constraints
security:
  max_upload_size_mb: 10
  rate_limit_per_minute: 30
  section_classifier_confidence_threshold: 0.60
  log_level: "INFO"
